<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- 파비콘: 지도 핀 + 포크 아이콘 (브랜드 컬러 그라디언트) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="부산 맛집 리뷰 플랫폼 - 현지인이 직접 쓴 솔직한 리뷰" />
    <title>맛지도 | 부산 맛집 리뷰</title>

    <!-- Open Graph: 카카오톡/페이스북 등에서 링크 공유 시 노출되는 썸네일 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="맛지도" />
    <meta property="og:title" content="맛지도 | 부산 맛집 리뷰" />
    <meta property="og:description" content="부산 맛집 리뷰 플랫폼 - 현지인이 직접 쓴 솔직한 리뷰" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- 배포 도메인이 정해지면 절대경로(https://실제도메인/og-image.png)와 og:url을 추가로 채워주세요 -->

    <!-- Twitter Card: 트위터(X)에서도 동일한 썸네일이 크게 노출되도록 설정 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="맛지도 | 부산 맛집 리뷰" />
    <meta name="twitter:description" content="부산 맛집 리뷰 플랫폼 - 현지인이 직접 쓴 솔직한 리뷰" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <!-- React 앱이 마운트되는 루트 DOM 노드 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
