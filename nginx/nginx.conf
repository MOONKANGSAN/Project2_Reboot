# =====================================================
# Nginx 리버스 프록시 설정
# 클라이언트의 모든 요청을 단일 포트(80)로 수신하여
# 경로에 따라 백엔드/프론트엔드 컨테이너로 분기
# =====================================================

# 워커 프로세스당 최대 동시 연결 수
events {
    worker_connections 1024;
}

http {

    # 클라이언트 요청 본문(업로드 파일 포함) 최대 크기
    # 기본값 1MB로는 이미지 업로드 시 413(Request Entity Too Large) 발생 → 10MB 업로드 허용 + multipart 오버헤드 여유분으로 12MB 설정
    client_max_body_size 12m;

    # Docker 내부 DNS 서버 — 컨테이너 재시작 시 IP 변경에 동적 대응
    # upstream 블록 대신 변수($backend, $frontend)를 사용해야 resolver가 동작함
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # ── API 요청 → Spring Boot 백엔드 ────────────────
        location /api/ {
            set $backend http://backend:8080;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── 업로드 이미지 → Spring Boot 백엔드 ──────────
        # WebMvcConfig에서 /uploads/** 를 file:/app/uploads/ 로 서빙
        location /uploads/ {
            set $backend http://backend:8080;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Vite HMR WebSocket 연결 ───────────────────────
        # 개발 환경에서 Hot Module Replacement를 위한 WebSocket 업그레이드 처리
        location /@vite/ {
            set $frontend http://frontend:5173;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ── 프론트엔드 요청 → Vite 개발 서버 ─────────────
        # 나머지 모든 요청을 프론트엔드로 프록시 (WebSocket HMR 포함)
        location / {
            set $frontend http://frontend:5173;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;

            # 프록시 타임아웃 설정 (개발 서버 시작 대기 시간 확보)
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
